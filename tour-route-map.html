<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route the Tour</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --void:#0B0E1A;
    --panel:#12172A;
    --panel-edge:#232B47;
    --ink:#F2F0E9;
    --muted:#8890A6;
    --amber:#FFC857;
    --violet:#7C5CFF;
    --danger:#FF5D6C;
    --ok:#4EE0A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--violet);color:white;}

  a:focus-visible, button:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .app{max-width:1180px;margin:0 auto;padding:20px 20px 48px;}

  /* ---- Header / departure board ---- */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; flex-wrap:wrap;
    border-bottom:1px solid var(--panel-edge); padding-bottom:16px; margin-bottom:20px;
  }
  .title-block .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--amber); margin:0 0 6px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:.02em;
    font-size:clamp(34px,5vw,54px); line-height:.9; margin:0; color:var(--ink);
  }
  .board{
    font-family:'JetBrains Mono',monospace;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:6px;
    padding:10px 18px; min-width:220px;
  }
  .board .row{display:flex; justify-content:space-between; gap:16px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}
  .board .amt{font-size:22px; color:var(--ok); font-weight:700; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
  .board .amt.negative{color:var(--danger);}
  .board .divider{height:1px; background:var(--panel-edge); margin:8px 0;}

  /* ---- Setup panel ---- */
  .setup{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:22px; margin-bottom:20px; display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase;}
  .field input{
    background:var(--void); border:1px solid var(--panel-edge); border-radius:6px;
    color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:16px; padding:9px 12px; width:150px;
  }
  .field input:focus{border-color:var(--amber); outline:none;}
  .btn{
    font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    font-size:13px; padding:11px 22px; border-radius:6px; border:1px solid transparent; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--amber); color:#221600;}
  .btn-primary:hover{background:#ffd67e;}
  .btn-ghost{background:transparent; color:var(--muted); border-color:var(--panel-edge);}
  .btn-ghost:hover{color:var(--ink); border-color:var(--muted);}

  /* ---- Layout ---- */
  .stage{display:grid; grid-template-columns:1.6fr 1fr; gap:20px;}
  @media (max-width:860px){ .stage{grid-template-columns:1fr;} }

  #map{
    width:100%; height:460px; border-radius:10px; border:1px solid var(--panel-edge);
    background:#0e1220;
  }
  .leaflet-container{background:#0e1220 !important;}
  .leaflet-control-attribution{
    background:rgba(11,14,26,.75) !important; color:var(--muted) !important;
    font-family:'JetBrains Mono',monospace; font-size:10px !important;
  }
  .leaflet-control-attribution a{color:var(--muted) !important;}

  /* dynamic route line draw-on animation */
  .route-path{
    stroke-dasharray: 10 8;
    animation: dash-flow 1.1s linear forwards, dash-scroll 22s linear infinite 1.1s;
  }
  @keyframes dash-flow{ from{ stroke-dashoffset: 900; } to{ stroke-dashoffset: 0; } }
  @keyframes dash-scroll{ to{ stroke-dashoffset:-1000; } }

  .city-dot{
    background:var(--amber); border:2px solid #0B0E1A; border-radius:50%;
  }
  .city-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink);
    background:rgba(11,14,26,.82); padding:2px 6px; border-radius:4px; border:1px solid var(--panel-edge);
    white-space:nowrap;
  }

  /* ---- Side column: current status + options + ledger ---- */
  .side{display:flex; flex-direction:column; gap:16px;}

  .panel{background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px; padding:18px;}
  .panel h2{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin:0 0 12px;
  }
  .current-city{font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--amber); margin:0 0 4px;}
  .current-sub{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin:0;}

  .option{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    width:100%; text-align:left; background:var(--void); border:1px solid var(--panel-edge);
    border-radius:8px; padding:12px 14px; margin-bottom:10px; cursor:pointer; color:var(--ink);
    font-family:'Inter',sans-serif; transition:border-color .12s ease, transform .12s ease;
  }
  .option:hover:not(:disabled){border-color:var(--violet); transform:translateX(2px);}
  .option:last-child{margin-bottom:0;}
  .option .name{font-weight:600; font-size:15px;}
  .option .meta{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-top:2px;}
  .option .cost{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--ok);}
  .option:disabled{opacity:.4; cursor:not-allowed;}
  .option:disabled .cost{color:var(--danger);}
  .option .tag{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--danger); text-transform:uppercase; letter-spacing:.06em;}

  .end-msg{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--muted); line-height:1.6;}
  .end-msg strong{color:var(--ink);}

  /* ---- Ticket log ---- */
  .stub{
    border:1px dashed var(--panel-edge); border-radius:8px; padding:10px 12px; margin-bottom:8px;
    font-family:'JetBrains Mono',monospace; font-size:12px; display:flex; justify-content:space-between; gap:10px;
    animation: stub-in .35s ease;
  }
  @keyframes stub-in{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;} }
  .stub .route{color:var(--ink);}
  .stub .miles{color:var(--muted);}
  .stub .price{color:var(--amber); font-weight:700;}
  .empty-log{color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:12px;}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title-block">
      <p class="eyebrow">WSRB GIS PUNK ROCK &mdash; Interactive Tour Planner</p>
      <h1>Route the Tour</h1>
    </div>
    <div class="board">
      <div class="row"><span>Miles logged</span><span id="milesReadout">0</span></div>
      <div class="divider"></div>
      <div class="row"><span>Remaining budget</span></div>
      <div class="amt" id="budgetReadout">$0</div>
    </div>
  </header>

  <div class="setup" id="setupPanel">
    <div class="field">
      <label for="startBudget">Starting budget ($)</label>
      <input type="number" id="startBudget" value="20000" min="0" step="500">
    </div>
    <div class="field">
      <label for="pricePerMile">Price per mile ($)</label>
      <input type="number" id="pricePerMile" value="5" min="0" step="0.5">
    </div>
    <button class="btn btn-primary" id="startBtn">Start in Seattle</button>
  </div>

  <div class="stage hidden" id="stage">
    <div id="map"></div>

    <div class="side">
      <div class="panel">
        <h2>Current city</h2>
        <p class="current-city" id="currentCityName">Seattle, WA</p>
        <p class="current-sub" id="legCount">Leg 0 &middot; 0 stops so far</p>
      </div>

      <div class="panel" id="optionsPanel">
        <h2>Select the next city</h2>
        <div id="optionsList"></div>
      </div>

      <div class="panel">
        <h2>Route log</h2>
        <div id="ticketLog"><p class="empty-log">No legs booked yet.</p></div>
      </div>

      <button class="btn btn-ghost" id="resetBtn">Reset tour</button>
    </div>
  </div>

</div>

<script>
/* ---------------------------------------------------------------
   EDIT THIS SECTION to swap in your real tour cities and routes.
   - CITIES: name -> {lat, lng}
   - NETWORK: name -> array of possible next-city names.
     At runtime, already-visited cities are automatically removed
     from the option list, so cycles in this graph are fine.
------------------------------------------------------------------*/
const CITIES = {
  "Seattle, WA":      { lat: 47.6062, lng: -122.3321 },
  "Portland, OR":      { lat: 45.5152, lng: -122.6784 },
  "Chicago, IL":       { lat: 41.8781, lng: -87.6298 },
  "Los Angeles, CA":   { lat: 34.0522, lng: -118.2437 },
  "Detroit, MI":       { lat: 42.3314, lng: -83.0458 },
  "New York, NY":      { lat: 40.7128, lng: -74.0060 },
  "Boston, MA":        { lat: 42.3601, lng: -71.0589 },
  "San Francisco, CA": { lat: 37.7749, lng: -122.4194 },
  "Denver, CO":        { lat: 39.7392, lng: -104.9903 },
  "Las Vegas, NV":     { lat: 36.1699, lng: -115.1398 },
  "San Diego, CA":     { lat: 32.7157, lng: -117.1611 },
  "Philadelphia, PA":  { lat: 39.9526, lng: -75.1652 },
  "Washington, DC":    { lat: 38.9072, lng: -77.0369 },
  "Austin, TX":        { lat: 30.2672, lng: -97.7431 },
  "Nashville, TN":     { lat: 36.1627, lng: -86.7816 },
  "Atlanta, GA":       { lat: 33.7490, lng: -84.3880 }
};

const NETWORK = {
  "Seattle, WA":      ["Portland, OR", "Chicago, IL", "Los Angeles, CA"],
  "Portland, OR":      ["San Francisco, CA", "Denver, CO", "Chicago, IL"],
  "Los Angeles, CA":   ["San Diego, CA", "Las Vegas, NV", "San Francisco, CA"],
  "Chicago, IL":       ["Detroit, MI", "New York, NY", "Boston, MA"],
  "Detroit, MI":       ["New York, NY", "Boston, MA", "Nashville, TN"],
  "New York, NY":      ["Boston, MA", "Philadelphia, PA", "Washington, DC"],
  "Boston, MA":        ["New York, NY", "Philadelphia, PA"],
  "San Francisco, CA": ["Los Angeles, CA", "Las Vegas, NV", "Denver, CO"],
  "Denver, CO":        ["Chicago, IL", "Austin, TX", "Las Vegas, NV"],
  "Las Vegas, NV":     ["Denver, CO", "Los Angeles, CA", "San Diego, CA"],
  "San Diego, CA":     ["Los Angeles, CA", "Las Vegas, NV"],
  "Philadelphia, PA":  ["Washington, DC", "New York, NY"],
  "Washington, DC":    ["Philadelphia, PA", "New York, NY"],
  "Austin, TX":        ["Nashville, TN", "Atlanta, GA", "Denver, CO"],
  "Nashville, TN":     ["Atlanta, GA", "Detroit, MI", "Austin, TX"],
  "Atlanta, GA":       ["Nashville, TN", "Austin, TX"]
};

const START_CITY = "Seattle, WA";
/* ------------------------------------------------------------- */

let budget = 20000;
let pricePerMile = 5;
let currentCity = START_CITY;
let visited = [START_CITY];
let totalMiles = 0;
let map, markersLayer;

function haversineMiles(a, b){
  const R = 3958.8;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}

function fmtMoney(n){
  return (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString();
}

function initMap(){
  map = L.map('map', { zoomControl: true, attributionControl: true }).setView([39.5, -98.35], 4);

  // Esri World Dark Gray Canvas (base) + Reference (labels, roads, borders)
  // Free, no API key required for these hosted tile services.
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    attribution: 'Esri, HERE, Garmin, FAO, NOAA, USGS'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    pane: 'overlayPane'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  placeCity(START_CITY);
  map.setView([CITIES[START_CITY].lat, CITIES[START_CITY].lng], 5);
}

function placeCity(name){
  const c = CITIES[name];
  const marker = L.marker([c.lat, c.lng], {
    icon: L.divIcon({ className:'', html:'<div class="city-dot" style="width:14px;height:14px;"></div>', iconSize:[14,14], iconAnchor:[7,7] })
  }).addTo(markersLayer);
  marker.bindTooltip(name, { permanent:true, direction:'top', className:'city-label', offset:[0,-8] });
}

function drawLeg(fromName, toName){
  const a = CITIES[fromName], b = CITIES[toName];
  const line = L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {
    color: '#7C5CFF', weight: 3, opacity: .9, className: 'route-path'
  }).addTo(markersLayer);
  return line;
}

function renderBoard(){
  document.getElementById('budgetReadout').textContent = fmtMoney(budget);
  document.getElementById('budgetReadout').classList.toggle('negative', budget < 0);
  document.getElementById('milesReadout').textContent = Math.round(totalMiles).toLocaleString();
}

function renderStatus(){
  document.getElementById('currentCityName').textContent = currentCity;
  document.getElementById('legCount').textContent =
    `Leg ${visited.length - 1} \u00b7 ${visited.length} stop${visited.length===1?'':'s'} so far`;
}

function renderOptions(){
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  const neighbors = (NETWORK[currentCity] || []).filter(n => !visited.includes(n));

  if (neighbors.length === 0){
    list.innerHTML = `<p class="end-msg">No unvisited cities left on the route from <strong>${currentCity}</strong>. <br><br>Tour complete &mdash; ${visited.length} stops, ${Math.round(totalMiles).toLocaleString()} miles, ${fmtMoney(budget)} remaining.</p>`;
    return;
  }

  let anyAffordable = false;
  neighbors.forEach(name => {
    const miles = haversineMiles(CITIES[currentCity], CITIES[name]);
    const cost = miles * pricePerMile;
    const affordable = cost <= budget;
    if (affordable) anyAffordable = true;

    const btn = document.createElement('button');
    btn.className = 'option';
    btn.disabled = !affordable;
    btn.innerHTML = `
      <span>
        <span class="name">${name}</span><br>
        <span class="meta">${Math.round(miles).toLocaleString()} mi${!affordable ? '<br><span class="tag">Over budget</span>' : ''}</span>
      </span>
      <span class="cost">${fmtMoney(cost)}</span>
    `;
    btn.addEventListener('click', () => selectCity(name, miles, cost));
    list.appendChild(btn);
  });

  if (!anyAffordable){
    const p = document.createElement('p');
    p.className = 'end-msg';
    p.style.marginTop = '12px';
    p.innerHTML = `Every remaining route from <strong>${currentCity}</strong> costs more than your remaining budget. <br><br>Tour ends here &mdash; ${visited.length} stops, ${Math.round(totalMiles).toLocaleString()} miles, ${fmtMoney(budget)} remaining.`;
    list.appendChild(p);
  }
}

function addTicketStub(fromName, toName, miles, cost){
  const log = document.getElementById('ticketLog');
  const empty = log.querySelector('.empty-log');
  if (empty) empty.remove();

  const stub = document.createElement('div');
  stub.className = 'stub';
  stub.innerHTML = `
    <span class="route">${fromName.split(',')[0]} &rarr; ${toName.split(',')[0]}</span>
    <span class="miles">${Math.round(miles).toLocaleString()} mi</span>
    <span class="price">${fmtMoney(cost)}</span>
  `;
  log.prepend(stub);
}

function selectCity(name, miles, cost){
  drawLeg(currentCity, name);
  placeCity(name);
  addTicketStub(currentCity, name, miles, cost);

  budget -= cost;
  totalMiles += miles;
  currentCity = name;
  visited.push(name);

  const bounds = visited.map(c => [CITIES[c].lat, CITIES[c].lng]);
  map.fitBounds(bounds, { padding: [40,40], maxZoom: 6 });

  renderBoard();
  renderStatus();
  renderOptions();
}

function resetTour(){
  budget = parseFloat(document.getElementById('startBudget').value) || 0;
  pricePerMile = parseFloat(document.getElementById('pricePerMile').value) || 0;
  currentCity = START_CITY;
  visited = [START_CITY];
  totalMiles = 0;

  markersLayer.clearLayers();
  placeCity(START_CITY);
  map.setView([CITIES[START_CITY].lat, CITIES[START_CITY].lng], 5);

  document.getElementById('ticketLog').innerHTML = '<p class="empty-log">No legs booked yet.</p>';
  renderBoard();
  renderStatus();
  renderOptions();
}

document.getElementById('startBtn').addEventListener('click', () => {
  budget = parseFloat(document.getElementById('startBudget').value) || 0;
  pricePerMile = parseFloat(document.getElementById('pricePerMile').value) || 0;
  document.getElementById('setupPanel').classList.add('hidden');
  document.getElementById('stage').classList.remove('hidden');
  initMap();
  renderBoard();
  renderStatus();
  renderOptions();
});

document.getElementById('resetBtn').addEventListener('click', resetTour);
</script>
</body>
</html>
